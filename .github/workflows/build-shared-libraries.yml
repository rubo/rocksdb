name: Build shared libraries

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: ubuntu-22.04
          vcpkg_triplet: x64-linux
        - arch: arm64
          runner: ubuntu-22.04-arm
          vcpkg_triplet: arm64-linux
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: "2026.04.27"
        path: vcpkg
    - name: Build static compression dependencies
      shell: bash
      run: |
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        ./vcpkg/vcpkg install \
          "snappy:${{ matrix.vcpkg_triplet }}" \
          "zstd:${{ matrix.vcpkg_triplet }}" \
          "lz4:${{ matrix.vcpkg_triplet }}" \
          "zlib:${{ matrix.vcpkg_triplet }}" \
          "bzip2:${{ matrix.vcpkg_triplet }}" \
          --clean-after-build
    - name: Configure
      shell: bash
      run: |
        cmake_args=(
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          "-DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DFAIL_ON_WARNINGS=OFF
          -DPORTABLE=1
          -DROCKSDB_BUILD_SHARED=ON
          -DUSE_RTTI=OFF
          "-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}"
          -DWITH_BENCHMARK_TOOLS=OFF
          -DWITH_CORE_TOOLS=OFF
          -DWITH_EXAMPLES=OFF
          -DWITH_GFLAGS=OFF
          -DWITH_JEMALLOC=OFF
          -DWITH_LIBURING=OFF
          -DWITH_LZ4=ON
          -DWITH_SNAPPY=ON
          -DWITH_TESTS=OFF
          -DWITH_TOOLS=OFF
          -DWITH_TRACE_TOOLS=OFF
          -DWITH_ZLIB=ON
          -DWITH_ZSTD=ON
          -DWITH_BZ2=ON
        )

        # RocksDB otherwise enables optional CRC and crypto instructions on
        # every aarch64 compiler that accepts the flags.
        if [[ "${{ matrix.arch }}" == "arm64" ]]; then
          cmake_args+=(
            "-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -march=armv8-a"
            "-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -march=armv8-a"
          )
        fi

        cmake "${cmake_args[@]}"
    - name: Build
      run: cmake --build build --config Release --target rocksdb-shared
    - name: Package
      shell: bash
      run: |
        package="rocksdb-linux-${{ matrix.arch }}"
        deps="$GITHUB_WORKSPACE/vcpkg/installed/${{ matrix.vcpkg_triplet }}"
        mkdir -p "$package/include" "$package/lib" "$package/licenses"
        cp -R include/rocksdb "$package/include/"
        cp -a build/librocksdb.so* "$package/lib/"
        cp COPYING LICENSE.Apache LICENSE.leveldb README.md "$package/"
        for dependency in snappy zstd lz4 zlib bzip2; do
          cp "$deps/share/$dependency/copyright" \
            "$package/licenses/$dependency.txt"
        done
        tar -czf "$package.tar.gz" "$package"
    - name: Verify
      shell: bash
      run: |
        file "rocksdb-linux-${{ matrix.arch }}/lib/"librocksdb.so*
        readelf -d "rocksdb-linux-${{ matrix.arch }}/lib/librocksdb.so" |
          grep NEEDED
        ldd "rocksdb-linux-${{ matrix.arch }}/lib/librocksdb.so"
        if readelf -d \
          "rocksdb-linux-${{ matrix.arch }}/lib/librocksdb.so" |
          grep -E 'lib(snappy|zstd|lz4|z|bz2)\.so'; then
          echo "Compression dependencies must be statically linked"
          exit 1
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: rocksdb-linux-${{ matrix.arch }}
        path: rocksdb-linux-${{ matrix.arch }}.tar.gz
        if-no-files-found: error
        retention-days: 30

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: windows-2022
          vcpkg_triplet: x64-windows-static-md
        - arch: arm64
          runner: windows-11-arm
          vcpkg_triplet: arm64-windows-static-md
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: "2026.04.27"
        path: vcpkg
    - name: Build static compression dependencies
      shell: pwsh
      run: |
        & ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
        if (!$?) { exit $LASTEXITCODE }
        & ./vcpkg/vcpkg.exe install `
          "snappy:${{ matrix.vcpkg_triplet }}" `
          "zstd:${{ matrix.vcpkg_triplet }}" `
          "lz4:${{ matrix.vcpkg_triplet }}" `
          "zlib:${{ matrix.vcpkg_triplet }}" `
          "bzip2:${{ matrix.vcpkg_triplet }}" `
          --clean-after-build
        if (!$?) { exit $LASTEXITCODE }
    - name: Configure
      shell: pwsh
      run: |
        $deps = Join-Path $PWD `
          "vcpkg/installed/${{ matrix.vcpkg_triplet }}"

        function Find-StaticLibrary([string[]] $patterns) {
          $libraryDirectory = Join-Path $deps "lib"
          foreach ($pattern in $patterns) {
            $matches = @(Get-ChildItem $libraryDirectory -File `
              -Filter $pattern)
            if ($matches.Count -eq 1) {
              return $matches[0].FullName
            }
            if ($matches.Count -gt 1) {
              throw "Multiple libraries matched ${pattern}: $matches"
            }
          }
          $available = Get-ChildItem $libraryDirectory -File -Filter *.lib |
            Select-Object -ExpandProperty Name
          $message = "Could not find any of: $($patterns -join ', '). " +
            "Available libraries: $($available -join ', ')"
          throw $message
        }

        $env:SNAPPY_INCLUDE = Join-Path $deps "include"
        $env:SNAPPY_LIB_RELEASE = Find-StaticLibrary @("snappy.lib")
        $env:SNAPPY_LIB_DEBUG = $env:SNAPPY_LIB_RELEASE
        $env:LZ4_INCLUDE = Join-Path $deps "include"
        $env:LZ4_LIB_RELEASE = Find-StaticLibrary @("lz4.lib")
        $env:LZ4_LIB_DEBUG = $env:LZ4_LIB_RELEASE
        $env:ZLIB_INCLUDE = Join-Path $deps "include"
        $env:ZLIB_LIB_RELEASE = Find-StaticLibrary `
          @("zs.lib", "zlib.lib", "zlibstatic.lib", "zlib*.lib")
        $env:ZLIB_LIB_DEBUG = $env:ZLIB_LIB_RELEASE
        $env:ZSTD_INCLUDE = Join-Path $deps "include"
        $env:ZSTD_LIB_RELEASE = Find-StaticLibrary `
          @("zstd.lib", "zstd_static.lib", "libzstd_static.lib")
        $env:ZSTD_LIB_DEBUG = $env:ZSTD_LIB_RELEASE
        $bzip2Library = Find-StaticLibrary `
          @("bz2.lib", "bzip2.lib", "libbz2.lib")

        $cmakeArguments = @(
          "-S", ".",
          "-B", "build",
          "-G", "Ninja",
          "-DCMAKE_BUILD_TYPE=Release",
          "-DCMAKE_C_COMPILER=clang-cl",
          "-DCMAKE_CXX_COMPILER=clang-cl",
          "-DCMAKE_CXX_FLAGS=/DBZIP2 /I$($deps)/include",
          "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld",
          "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON",
          "-DCMAKE_LINKER=lld-link",
          "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL",
          "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld $bzip2Library",
          "-DFAIL_ON_WARNINGS=OFF",
          "-DPORTABLE=1",
          "-DROCKSDB_BUILD_SHARED=ON",
          "-DROCKSDB_INSTALL_ON_WINDOWS=ON",
          "-DUSE_RTTI=OFF",
          "-DWITH_BENCHMARK_TOOLS=OFF",
          "-DWITH_CORE_TOOLS=OFF",
          "-DWITH_EXAMPLES=OFF",
          "-DWITH_GFLAGS=OFF",
          "-DWITH_JEMALLOC=OFF",
          "-DWITH_LIBURING=OFF",
          "-DWITH_LZ4=ON",
          "-DWITH_SNAPPY=ON",
          "-DWITH_TESTS=OFF",
          "-DWITH_TOOLS=OFF",
          "-DWITH_TRACE_TOOLS=OFF",
          "-DWITH_ZLIB=ON",
          "-DWITH_ZSTD=ON"
        )
        & cmake @cmakeArguments
        if (!$?) { exit $LASTEXITCODE }
    - name: Build
      run: cmake --build build --config Release --target rocksdb-shared
    - name: Package
      shell: pwsh
      run: |
        $package = "rocksdb-windows-${{ matrix.arch }}"
        $deps = Join-Path $PWD `
          "vcpkg/installed/${{ matrix.vcpkg_triplet }}"
        New-Item -ItemType Directory -Path `
          "$package/bin", "$package/include", "$package/lib", `
          "$package/licenses" | Out-Null
        Copy-Item include/rocksdb "$package/include/" -Recurse

        $dll = Get-ChildItem build -Recurse -Filter rocksdb-shared.dll |
          Select-Object -First 1
        $importLibrary = Get-ChildItem build -Recurse `
          -Filter rocksdb-shared.lib | Select-Object -First 1
        if (!$dll -or !$importLibrary) {
          throw "RocksDB DLL or import library was not produced"
        }

        Copy-Item $dll.FullName "$package/bin/"
        Copy-Item $importLibrary.FullName "$package/lib/"
        Get-ChildItem build -Recurse -Filter rocksdb-shared.pdb |
          Select-Object -First 1 |
          Copy-Item -Destination "$package/bin/"
        Copy-Item COPYING, LICENSE.Apache, LICENSE.leveldb, README.md $package
        foreach ($dependency in @("snappy", "zstd", "lz4", "zlib", "bzip2")) {
          Copy-Item "$deps/share/$dependency/copyright" `
            "$package/licenses/$dependency.txt"
        }
        Compress-Archive -Path $package -DestinationPath "$package.zip"
    - name: Verify
      shell: pwsh
      run: |
        $package = "rocksdb-windows-${{ matrix.arch }}"
        $dll = Get-Item "$package/bin/rocksdb-shared.dll"
        $dependencies = & llvm-readobj --coff-imports $dll.FullName
        $dependencies
        if ($dependencies -match `
          "(snappy|zstd|lz4|zlib|bzip2|libbz2)\.dll") {
          throw "Compression dependencies must be statically linked"
        }
        Get-Item "$package/lib/rocksdb-shared.lib"
    - uses: actions/upload-artifact@v4
      with:
        name: rocksdb-windows-${{ matrix.arch }}
        path: rocksdb-windows-${{ matrix.arch }}.zip
        if-no-files-found: error
        retention-days: 30

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: macos-15-intel
          cmake_arch: x86_64
          deployment_target: "10.15"
          vcpkg_triplet: x64-osx
        - arch: arm64
          runner: macos-15
          cmake_arch: arm64
          deployment_target: "11.0"
          vcpkg_triplet: arm64-osx
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: "2026.04.27"
        path: vcpkg
    - name: Build static compression dependencies
      env:
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      run: |
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        ./vcpkg/vcpkg install \
          "snappy:${{ matrix.vcpkg_triplet }}" \
          "zstd:${{ matrix.vcpkg_triplet }}" \
          "lz4:${{ matrix.vcpkg_triplet }}" \
          "zlib:${{ matrix.vcpkg_triplet }}" \
          "bzip2:${{ matrix.vcpkg_triplet }}" \
          --clean-after-build
    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }} \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
          -DFAIL_ON_WARNINGS=OFF \
          -DPORTABLE=1 \
          -DROCKSDB_BUILD_SHARED=ON \
          -DUSE_RTTI=OFF \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
          -DWITH_BENCHMARK_TOOLS=OFF \
          -DWITH_CORE_TOOLS=OFF \
          -DWITH_EXAMPLES=OFF \
          -DWITH_GFLAGS=OFF \
          -DWITH_JEMALLOC=OFF \
          -DWITH_LIBURING=OFF \
          -DWITH_LZ4=ON \
          -DWITH_SNAPPY=ON \
          -DWITH_TESTS=OFF \
          -DWITH_TOOLS=OFF \
          -DWITH_TRACE_TOOLS=OFF \
          -DWITH_ZLIB=ON \
          -DWITH_ZSTD=ON \
          -DWITH_BZ2=ON
    - name: Build
      run: cmake --build build --config Release --target rocksdb-shared
    - name: Package
      run: |
        package="rocksdb-macos-${{ matrix.arch }}"
        deps="$GITHUB_WORKSPACE/vcpkg/installed/${{ matrix.vcpkg_triplet }}"
        mkdir -p "$package/include" "$package/lib" "$package/licenses"
        cp -R include/rocksdb "$package/include/"
        cp -a build/librocksdb*.dylib "$package/lib/"
        cp COPYING LICENSE.Apache LICENSE.leveldb README.md "$package/"
        for dependency in snappy zstd lz4 zlib bzip2; do
          cp "$deps/share/$dependency/copyright" \
            "$package/licenses/$dependency.txt"
        done
        tar -czf "$package.tar.gz" "$package"
    - name: Verify
      run: |
        file "rocksdb-macos-${{ matrix.arch }}/lib/"librocksdb*.dylib
        otool -L "rocksdb-macos-${{ matrix.arch }}/lib/librocksdb.dylib"
        otool -l "rocksdb-macos-${{ matrix.arch }}/lib/librocksdb.dylib" |
          grep -A 3 LC_BUILD_VERSION
        if otool -L \
          "rocksdb-macos-${{ matrix.arch }}/lib/librocksdb.dylib" |
          grep -E 'lib(snappy|zstd|lz4|z|bz2)\.'; then
          echo "Compression dependencies must be statically linked"
          exit 1
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: rocksdb-macos-${{ matrix.arch }}
        path: rocksdb-macos-${{ matrix.arch }}.tar.gz
        if-no-files-found: error
        retention-days: 30
